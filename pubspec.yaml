name: gaze_app
description: "GazeLink - Eye-gaze based AAC communication app for ALS patients."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.12.1
  camera_android: ^0.10.12
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  flutter_svg: ^2.3.4

  # State management — Cubit/Bloc pattern (MVVM ViewModel layer)
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Declarative navigation
  go_router: ^15.1.2

  dio: ^5.11.1
  shared_preferences: ^2.5.6
  get_it: ^9.3.0
  sqflite: ^2.4.4+2
  path: ^1.9.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo[slnt,wght].ttf
